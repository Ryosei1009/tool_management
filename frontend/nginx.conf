# 画面の配信と、/api の backend への中継。
# QR コードの読み取り（カメラ）は HTTPS でしか動かないので、
# 本番ではこの前段（社内のリバースプロキシやロードバランサー）で HTTPS にすること。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 工具の写真・マップ画像のアップロード（5MB）に合わせる
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # API（/api/... → backend の /...）
    location /api/ {
        proxy_pass http://api:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 画面と同じホストから呼ぶので CORS は不要。Origin を落として backend の許可リストに依存しない。
        proxy_set_header Origin "";
    }

    # ファイル名にハッシュが付くものは長くキャッシュする
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # 画面のパス（/tools など）は index.html を返す
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }
}
